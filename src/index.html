<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sweet Sales</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ec4899">
  <meta name="description" content="Manage sweet shop orders - cakes, cupcakes and cookies.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sweet Sales">
  <script>
    // Apply the persisted theme before Angular boots to avoid a light-mode flash.
    (function () {
      try {
        var settings = JSON.parse(localStorage.getItem('sweet-sales-settings') || '{}');
        if (settings.theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        // Ignore malformed storage data.
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>
    <h1 style="text-align:center;font-family:sans-serif">Sweet Sales requires JavaScript to run.</h1>
  </noscript>
</body>
</html>
